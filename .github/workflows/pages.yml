# Builds the app and publishes it on GitHub Pages at
# https://<owner>.github.io/<repo>/ on every push to main.
#
# One-time setup: Settings → Pages → Source: GitHub Actions, and under
# Settings → Secrets and variables → Actions → Variables:
#   PUBLIC_SUPABASE_URL  e.g. https://<ref>.supabase.co
#   PUBLIC_SUPABASE_KEY  the project's publishable key (made to be public)
# Without them the published site is the demo only.
name: Objavi na GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: withastro/action@v6
        env:
          BASE_PATH: /${{ github.event.repository.name }}
          PUBLIC_SUPABASE_URL: ${{ vars.PUBLIC_SUPABASE_URL }}
          PUBLIC_SUPABASE_KEY: ${{ vars.PUBLIC_SUPABASE_KEY }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
