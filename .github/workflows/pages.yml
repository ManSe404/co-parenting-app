# Optional: publishes the app on GitHub Pages at
# https://<owner>.github.io/<repo>/ on every push to main. Off by default
# (the author's copy is on Cloudflare Pages); to use it in your fork:
#   Settings → Pages → Source: GitHub Actions, and under
#   Settings → Secrets and variables → Actions → Variables:
#     OBJAVI_PAGES         da
#     PUBLIC_SUPABASE_URL  e.g. https://<ref>.supabase.co
#     PUBLIC_SUPABASE_KEY  the project's publishable key (made to be public)
# Without the two Supabase values the published site is the demo only.
name: Objavi na GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    if: ${{ vars.OBJAVI_PAGES == 'da' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: withastro/action@v6
        env:
          BASE_PATH: /${{ github.event.repository.name }}
          # The author's copy talks to its own Supabase project (both values are
          # public by design: they end up in the site anyway). Forks use their
          # own repository variables, or get the demo without them.
          PUBLIC_SUPABASE_URL: ${{ vars.PUBLIC_SUPABASE_URL || (github.repository == 'ManSe404/co-parenting-app' && 'https://azhapzvfhgbaibihnwie.supabase.co' || '') }}
          PUBLIC_SUPABASE_KEY: ${{ vars.PUBLIC_SUPABASE_KEY || (github.repository == 'ManSe404/co-parenting-app' && 'sb_publishable_4onxBdkCWzoUD2Bb98vQhg_XaW2fqZT' || '') }}

  deploy:
    if: ${{ vars.OBJAVI_PAGES == 'da' }}
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
